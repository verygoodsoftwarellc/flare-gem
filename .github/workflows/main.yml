name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    # ubuntu-latest is now 26.04, which setup-ruby has no Ruby 3.0/3.1 builds
    # for. Pin 24.04 while the gem still supports those Rubies.
    runs-on: ubuntu-24.04
    name: Ruby ${{ matrix.ruby }} / Rails ${{ matrix.rails }}
    strategy:
      fail-fast: false
      matrix:
        ruby:
          - "3.0"
          - "3.1"
          - "3.2"
          - "3.3"
          - "3.4"
        rails:
          - "7.0"
          - "7.1"
          - "7.2"
          - "8.0"
        exclude:
          - ruby: "3.0"
            rails: "7.2"
          - ruby: "3.0"
            rails: "8.0"
          - ruby: "3.1"
            rails: "8.0"

    env:
      RAILS_VERSION: "~> ${{ matrix.rails }}.0"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true

      - name: Run tests
        run: bundle exec rake test
